name: Buscar Partidos Diario - Poisson Bivariado + LSTM

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Fecha de inicio (YYYY-MM-DD) - Dejar vacío para HOY'
        required: false
        default: ''
      date_to:
        description: 'Fecha de fin (YYYY-MM-DD) - Dejar vacío para HOY'
        required: false
        default: ''

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache de pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar instalación de TensorFlow
      run: |
        python -c "import tensorflow as tf; print(f'TensorFlow versión: {tf.__version__}')"
        python -c "import numpy; print(f'NumPy versión: {numpy.__version__}')"
        python -c "import scipy; print(f'SciPy versión: {scipy.__version__}')"

    - name: Ejecutar script de predicción
      env:
        THE_STATS_API_KEY: ${{ secrets.THE_STATS_API_KEY }}
        INPUT_DATE_FROM: ${{ github.event.inputs.date_from }}
        INPUT_DATE_TO: ${{ github.event.inputs.date_to }}
      run: |
        echo "Iniciando análisis con Poisson Bivariado + LSTM Momentum..."
        python script.py
        echo "Script completado exitosamente"

    - name: Verificar archivo de salida
      run: |
        if [ -f partidos_del_dia.csv ]; then
          echo "✓ Archivo partidos_del_dia.csv generado"
          wc -l partidos_del_dia.csv
          head -5 partidos_del_dia.csv
        else
          echo "✗ Error: archivo no generado"
          exit 1
        fi

    - name: Guardar resultados en el repositorio
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add partidos_del_dia.csv
        git commit -m "Actualización de partidos (Poisson+LSTM): $(date +'%Y-%m-%d %H:%M:%S UTC')" || echo "Sin cambios para commitear"
        git push

    - name: Notificar error
      if: failure()
      run: |
        echo "::error::El workflow falló en la ejecución del script"
        echo "Revisa los logs para más detalles"
