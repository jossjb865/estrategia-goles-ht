name: Buscar Partidos Diario

on:
  schedule:
    - cron: '0 5 * * *' # Se ejecuta de forma automática todos los días a las 05:00 UTC
  workflow_dispatch: # Permite forzar la ejecución manual desde la pestaña Actions de GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de predicción
      env:
        THE_STATS_API_KEY: ${{ secrets.THE_STATS_API_KEY }}
      run: python script.py

    - name: Guardar resultados en el repositorio
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add partidos_del_dia.csv
        git commit -m "Actualización diaria de partidos: $(date +'%Y-%m-%d')" || exit 0
        git push
